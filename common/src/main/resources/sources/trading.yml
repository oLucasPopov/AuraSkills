sources:
  # Villager trades by villager level (1 = novice ... 5 = master), any profession
  master_trade:
    type: trading
    trigger: villager_trade
    min_villager_level: 5
    xp: 30.0
    menu_item:
      material: diamond
  expert_trade:
    type: trading
    trigger: villager_trade
    min_villager_level: 4
    max_villager_level: 4
    xp: 25.0
    menu_item:
      material: emerald_block
  journeyman_trade:
    type: trading
    trigger: villager_trade
    min_villager_level: 3
    max_villager_level: 3
    xp: 20.0
    menu_item:
      material: emerald_block
  apprentice_trade:
    type: trading
    trigger: villager_trade
    min_villager_level: 2
    max_villager_level: 2
    xp: 15.0
    menu_item:
      material: emerald
  novice_trade:
    type: trading
    trigger: villager_trade
    max_villager_level: 1
    xp: 10.0
    menu_item:
      material: emerald
  wandering_trader_trade:
    type: trading
    trigger: wandering_trader_trade
    xp: 15.0
    menu_item:
      material: blue_orchid
  # Piglin bartering, tiered by real outcome (first matching source wins, rarest first)
  piglin_barter_ender_pearl:
    type: trading
    trigger: piglin_barter
    barter_item: ender_pearl
    xp: 25.0
    menu_item:
      material: ender_pearl
  piglin_barter_enchanted_book:
